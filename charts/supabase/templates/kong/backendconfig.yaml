{{- if .Values.kong.enabled -}}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: supabase-kong-backend-config
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /status
    port: 8100
{{- end }}

